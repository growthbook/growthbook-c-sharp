# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Release-please opens a release PR after each merge to main. Merging that PR creates the tag and the
# GitHub release, and this workflow then publishes to NuGet. Run it manually to retry a failed publish
# of the version on the chosen branch or tag.
# Publishing stays in this file because the NuGet Trusted Publishing policy names it. Releases created
# with GITHUB_TOKEN don't trigger other workflows, so a separate release workflow couldn't start it.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-main
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  create_nuget:
    needs: release-please
    # `!cancelled()` lets a manual run continue past the skipped release-please job
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
        fetch-depth: 0 # Get all history

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack ./GrowthBook/GrowthBook.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  run_test:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Run tests
      run: dotnet test --configuration Release ./GrowthBook.Tests/GrowthBook.Tests.csproj --logger:"console;verbosity=normal"

  deploy:
    if: ${{ !cancelled() && needs.create_nuget.result == 'success' && needs.run_test.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [ create_nuget, run_test ]
    permissions:
      id-token: write # lets NuGet/login exchange the job's OIDC token for a temporary API key
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      # Trusted Publishing: nuget.org checks the OIDC token against the GrowthBook organization's
      # policy for this repo and workflow, and returns an API key that's valid for an hour
      - name: Get a temporary NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          # The GrowthBook org owns the policy, but the lookup happens by the user who created the policy, which is silly.
          # If this user is no longer in the org, you may need to recreate the policy following the Trusted Publishing instructions.
          user: ${{ secrets.NUGET_USER }}

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          dotnet nuget --version
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
